# Installer settings for the x86-64 ISO (Subiquity autoinstall format).
# ${NAME} placeholders are filled in from config/build.env and config/secrets.env.
# The `user-data:` section is appended at build time from common-user-data.yaml,
# so first-boot packages and scripts are shared with the Raspberry Pi image.
autoinstall:
  version: 1
  locale: ${LOCALE}
  keyboard:
    layout: ${KEYBOARD_LAYOUT}
  identity:
    hostname: ${HOSTNAME_PREFIX}
    username: ${ADMIN_USER}
    password: "${PASSWORD_HASH}"
  ssh:
    install-server: true
    allow-pw: ${SSH_ALLOW_PASSWORD}
    authorized-keys: ${SSH_AUTHORIZED_KEYS}
  storage:
    layout:
      name: lvm
    # Kubernetes needs swap off, so don't create a swap file.
    swap:
      size: 0
  late-commands:
    # Create the docker group and add the user now, at install time, so the very
    # first login already has it (Docker itself is installed on first boot).
    - curtin in-target -- groupadd --system --force docker
    - curtin in-target -- usermod -aG docker ${ADMIN_USER}
    # sudo rule for the login user: sudo asks for its password. (The key-only
    # NOSSHPW_USER, added in user-data, runs sudo without a prompt.) Checked with
    # visudo; removed if invalid so sudo can never be broken by it.
    - >-
      curtin in-target -- sh -c 'f=/etc/sudoers.d/90-${ADMIN_USER};
      echo "${ADMIN_USER} ALL=(ALL:ALL) ${SUDO_RULE}" > $f && chmod 0440 $f && visudo -cf $f || rm -f $f'
