# Installer settings for the desktop ISO (Ubuntu Desktop, autoinstall format),
# meant for local VMs. ${NAME} placeholders are filled in from config/build.env
# and config/secrets.env. The `user-data:` section (first-boot tools and Docker)
# is appended at build time from desktop-user-data.yaml.
autoinstall:
  version: 1
  locale: ${LOCALE}
  keyboard:
    layout: ${KEYBOARD_LAYOUT}
  identity:
    realname: ${ADMIN_USER}
    hostname: ${HOSTNAME_PREFIX}
    username: ${ADMIN_USER}
    password: "${PASSWORD_HASH}"
  ssh:
    install-server: true
    allow-pw: ${SSH_ALLOW_PASSWORD}
    authorized-keys: ${SSH_AUTHORIZED_KEYS}
  storage:
    layout:
      name: lvm
  packages:
    # VM guest tools: clean shutdown and IP reporting to the host (virsh
    # domifaddr), plus clipboard sharing and automatic screen resizing.
    - qemu-guest-agent
    - spice-vdagent
    # Runs the first-boot setup from desktop-user-data.yaml; make sure it's installed.
    - cloud-init
  late-commands:
    # Create the docker group and add the user now, at install time, so the very
    # first login already has it (Docker itself is installed on first boot).
    - curtin in-target -- groupadd --system --force docker
    - curtin in-target -- usermod -aG docker ${ADMIN_USER}
    # Let the first-boot user-data run even if the desktop image disabled cloud-init.
    - rm -f /target/etc/cloud/cloud-init.disabled
    # Skip GNOME's "Welcome to Ubuntu" setup wizard on first login.
    - >-
      curtin in-target -- sh -c 'install -d -m 0755 -o ${ADMIN_USER} -g ${ADMIN_USER} /home/${ADMIN_USER}/.config
      && echo yes > /home/${ADMIN_USER}/.config/gnome-initial-setup-done
      && chown ${ADMIN_USER}:${ADMIN_USER} /home/${ADMIN_USER}/.config/gnome-initial-setup-done'
