#cloud-config
# First-boot settings for the Raspberry Pi image (cloud-init format). These
# replace what the installer's identity/ssh sections do on the ISO.
# ${NAME} placeholders are filled in from config/build.env and config/secrets.env.
# common-user-data.yaml is appended to this file at build time.
locale: ${LOCALE}
ssh_pwauth: ${SSH_ALLOW_PASSWORD}
users:
  - name: ${ADMIN_USER}
    # cloud-init creates the docker group if it doesn't exist yet, so the user
    # has it from the first login (Docker itself is installed later in first boot).
    groups: [adm, sudo, docker]
    shell: /bin/bash
    # sudo asks for this user's password; the key-only user below has no prompt.
    sudo: "ALL=(ALL:ALL) ${SUDO_RULE}"
    lock_passwd: false
    passwd: "${PASSWORD_HASH}"
    ssh_authorized_keys: ${SSH_AUTHORIZED_KEYS}
  # The key-only user (NOSSHPW_USER, default "nosshpw") is added on the next line
  # at build time: no password, keys from config/nosshpw_authorized_keys, sudo
  # without a prompt. Keep this marker line.
  # @NOSSHPW_USER@
