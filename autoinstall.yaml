autoinstall:
  version: 1
  locale: en_US
  keyboard:
    layout: us
  identity:
    hostname: amd-ubuntu-k8s-temp
    username: admin
    password: "$1$QwVnSDjk$UYEr7bEXi9rwDrlLqDlrr/"
  ssh:
    install-server: true
    allow-pw: true
    authorized-keys:
      - ssh-rsa AAAAB4NzaC1yc2EAAAADAQABAAABAQC... # Add your SSH key here
  storage:
    layout:
      name: lvm
  user-data:
    package_update: true
    package_upgrade: true
    packages:
      - vim
      - curl
      - wget
      - git
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      - python3-pip
      - python3-setuptools
      - python3-wheel
      - htop
      - tree
      - unzip
      - net-tools
    runcmd:
      - |
        #!/bin/bash
        # Send all output from this script to a log file for easy debugging
        exec > /var/log/hostname-debug.log 2>&1
        
        set -x # Print each command to the log file before it is executed

        echo "--- Starting hostname script at $(date) ---"

        # Define the base for the new hostname
        BASE_HOSTNAME="amd-ubuntu-k8s"
        
        # Find the first available physical network interface (that isn't the loopback 'lo')
        INTERFACE=$(ls /sys/class/net | grep -v lo | head -n 1)

        if [ -z "$INTERFACE" ]; then
          echo "ERROR: Could not find a network interface. Aborting."
          exit 1
        fi
        
        echo "Found network interface: $INTERFACE"

        # Get the last 6 characters of the MAC address for that interface
        MAC_SUFFIX=$(cat /sys/class/net/$INTERFACE/address | sed 's/://g' | rev | cut -c1-6 | rev)
        
        # Construct the new, unique hostname
        NEW_HOSTNAME="$BASE_HOSTNAME-$MAC_SUFFIX"
        
        # Use hostnamectl to set the new name system-wide
        echo "Setting new hostname to $NEW_HOSTNAME"
        hostnamectl set-hostname $NEW_HOSTNAME

        echo "--- Hostname script finished successfully ---"

      # Install Docker
      - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      - apt-get update
      - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
      - systemctl enable docker
      - systemctl start docker
      - usermod -aG docker admin

      # Install Kubernetes components
      - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /' | tee /etc/apt/sources.list.d/kubernetes.list
      - apt-get update
      - apt-get install -y kubelet kubeadm kubectl
      - apt-mark hold kubelet kubeadm kubectl

      # Install Ansible
      - pip3 install ansible

      # Install Helm
      - curl https://baltocdn.com/helm/signing.asc | gpg --dearmor | tee /usr/share/keyrings/helm.gpg > /dev/null
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/helm.gpg] https://baltocdn.com/helm/stable/debian/ all main" | tee /etc/apt/sources.list.d/helm-stable-debian.list
      - apt-get update
      - apt-get install -y helm

      # Configure Docker daemon
      - |
        echo "--> Configuring Docker daemon..."
        mkdir -p /etc/docker
        cat <<EOF > /etc/docker/daemon.json
        {
          "exec-opts": ["native.cgroupdriver=systemd"],
          "log-driver": "json-file",
          "log-opts": {
            "max-size": "100m"
          },
          "storage-driver": "overlay2"
        }
        EOF
        systemctl daemon-reload
        systemctl restart docker

      # Disable swap for Kubernetes
      - swapoff -a
      - sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab

      # Configure sysctl for Kubernetes
      - echo 'net.bridge.bridge-nf-call-iptables = 1' >> /etc/sysctl.conf
      - echo 'net.bridge.bridge-nf-call-ip6tables = 1' >> /etc/sysctl.conf
      - sysctl --system

      # Create useful aliases
      - echo 'alias k="kubectl"' >> /home/admin/.bashrc
      - echo 'alias d="docker"' >> /home/admin/.bashrc
      - echo 'alias dc="docker-compose"' >> /home/admin/.bashrc
      - echo 'alias h="helm"' >> /home/admin/.bashrc
      - echo 'alias a="ansible"' >> /home/admin/.bashrc

      # Set up basic firewall rules
      - ufw allow ssh
      - ufw allow 6443/tcp  # Kubernetes API
      - ufw allow 10250/tcp # Kubelet
      - ufw allow 2379:2380/tcp # etcd
      - ufw allow 10251/tcp # kube-scheduler
      - ufw allow 10252/tcp # kube-controller-manager
      - ufw --force enable

